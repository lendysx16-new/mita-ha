name: Mita (mieru server)
version: "3.38.0.13"
slug: mita
description: "Mita server for the mieru proxy protocol with local admin UI and subscriptions"
url: "https://github.com/lendysx16-new/mita-ha"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8098
panel_icon: mdi:account-network
panel_admin: true
ports:
  "2022/tcp": 2022
  "8099/tcp": 8099
ports_description:
  "2022/tcp": "Mieru / mita TCP"
  "8099/tcp": "Subscription HTTP server (reverse proxy only /sub/* through Caddy)"
options:
  users:
    - username: "change-me"
      password: "change-this-password"
  log_level: "INFO"
  prefer_ipv4: true
  allow_private_ip: false
  allow_loopback_ip: false
  public_mieru_host: "me.lendysx16.ru"
  public_mieru_port: 8443
  subscription_base_url: "https://me.lendysx16.ru"
schema:
  users:
    - username: str
      password: password
  log_level: "list(FATAL|ERROR|WARN|INFO|DEBUG|TRACE)"
  prefer_ipv4: bool
  allow_private_ip: bool
  allow_loopback_ip: bool
  public_mieru_host: str
  public_mieru_port: "int(1,65535)"
  subscription_base_url: url
