name: Validate add-on

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile mita/webapp.py
      - name: Backend regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax and offline Linux installer checks
        run: |
          bash -n mita/run.sh
          bash -n mita/install-linux.sh
          bash mita/install-linux.sh clashmi deb --dry-run | grep -F 'KaringX/clashmi|'
          bash mita/install-linux.sh karing rpm --dry-run | grep -F 'KaringX/karing|'
          bash mita/install-linux.sh flclashx appimage --dry-run | grep -F 'pluralplay/FlClashX|'
          bash mita/install-linux.sh koala deb --dry-run | grep -F 'coolcoala/koala-clash|'
          if bash mita/install-linux.sh unknown deb --dry-run; then exit 1; fi
          if bash mita/install-linux.sh koala appimage --dry-run; then exit 1; fi
      - name: Parse YAML
        run: |
          python3 - <<'PY'
          import yaml
          for path in ["repository.yaml", "mita/config.yaml"]:
              with open(path, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(path, "OK")
          PY
      - name: Validate standalone admin panel
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("mita/webapp.py").read_text(encoding="utf-8")
          html = Path("mita/admin.html").read_text(encoding="utf-8")
          docker = Path("mita/Dockerfile").read_text(encoding="utf-8")
          assert 'Path(__file__).with_name("admin.html")' in source
          assert "COPY admin.html /app/admin.html" in docker
          required = ("users", "deviceUsers", "traffic", "refreshTraffic", "contactEmail", "backupStatus",
                      "username", "password", "host", "port", "base",
                      "logLevel", "postgresDsn", "msg")
          for name in required:
              assert f'id="{name}"' in html, name
          script = re.search(r"<script>(.*?)</script>", html, re.S)
          assert script, "admin script missing"
          Path("/tmp/mita-admin.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/mita-admin.js
      - name: Validate subscription page
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("mita/subscription.html").read_text(encoding="utf-8")
          assert "@@BOOTSTRAP_JSON@@" in source
          assert "@@USERNAME_HTML@@" in source
          assert "@@SUBSCRIPTION_URL_HTML@@" in source
          assert "@@CONTACT_LINK_HTML@@" in source
          assert 'id="installTitle"' in source
          assert 'id="connectTitle"' in source
          assert "cdn.jsdelivr.net" not in source
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          assert len(scripts) == 2
          Path("/tmp/mita-subscription.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/mita-subscription.js
          node --test tests/test_subscription.mjs
