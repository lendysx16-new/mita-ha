name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile mita/webapp.py mita/daemon.py
      - name: Backend regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax and offline Linux installer checks
        run: |
          bash -n scripts/deploy-compose.sh
          bash -n mita/run-backend.sh
          sh -n hysteria/watch.sh
          bash -n mita/install-linux.sh
          export MITA_INSTALL_ARCH=x86_64
          bash mita/install-linux.sh clashmi deb --dry-run | grep -F 'KaringX/clashmi|'
          bash mita/install-linux.sh karing deb --dry-run | grep -F 'KaringX/karing|'
          bash mita/install-linux.sh flclashx appimage --dry-run | grep -F 'pluralplay/FlClashX|'
          bash mita/install-linux.sh koala deb --dry-run | grep -F 'coolcoala/koala-clash|'
          bash mita/install-linux.sh slothclash rpm --dry-run | grep -F 'Nemu-x/SlothClash|'
          # auto picks the first format this machine prefers that the client actually publishes
          MITA_INSTALL_ARCH=aarch64 MITA_INSTALL_PREFER="deb appimage" bash mita/install-linux.sh flclashx auto --dry-run | grep -F '|deb'
          MITA_INSTALL_PREFER="rpm appimage" bash mita/install-linux.sh slothclash auto --dry-run | grep -F '|rpm'
          MITA_INSTALL_PREFER="appimage" bash mita/install-linux.sh clashmi auto --dry-run | grep -F '|appimage'
          if MITA_INSTALL_PREFER="rpm appimage" bash mita/install-linux.sh karing auto --dry-run; then exit 1; fi
          if bash mita/install-linux.sh unknown deb --dry-run; then exit 1; fi
          if bash mita/install-linux.sh koala appimage --dry-run; then exit 1; fi
          if bash mita/install-linux.sh karing rpm --dry-run; then exit 1; fi
      - name: Parse YAML
        run: |
          python3 - <<'PY'
          import yaml
          for path in ["compose.yaml", ".github/workflows/validate.yml"]:
              with open(path, "r", encoding="utf-8") as f:
                  config = yaml.safe_load(f)
              if path == "compose.yaml":
                  mounts = config["services"]["hysteria2"]["volumes"]
                  assert not any("mita-data" in str(mount) for mount in mounts), mounts
                  assert any("hysteria-config" in str(mount) for mount in mounts), mounts
              print(path, "OK")
          PY
      - name: Validate standalone admin panel
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("mita/webapp.py").read_text(encoding="utf-8")
          html = Path("mita/admin.html").read_text(encoding="utf-8")
          docker = Path("mita/Dockerfile").read_text(encoding="utf-8")
          assert 'Path(__file__).with_name("admin.html")' in source
          assert "COPY admin.html /app/admin.html" in docker
          assert "COPY clients.json /app/clients.json" in docker
          required = ("users", "deviceUsers", "traffic", "refreshTraffic", "contactEmail", "backupStatus",
                      "username", "password", "host", "port", "base",
                      "logLevel", "postgresDsn", "msg")
          for name in required:
              assert f'id="{name}"' in html, name
          script = re.search(r"<script>(.*?)</script>", html, re.S)
          assert script, "admin script missing"
          Path("/tmp/mita-admin.js").write_text(script.group(1), encoding="utf-8")
          PY
          node --check /tmp/mita-admin.js
          node --test tests/test_admin.mjs
      - name: Validate subscription page
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("mita/subscription.html").read_text(encoding="utf-8")
          assert "@@BOOTSTRAP_JSON@@" in source
          assert "@@USERNAME_HTML@@" in source
          assert "@@SUBSCRIPTION_URL_HTML@@" in source
          assert "@@CONTACT_LINK_HTML@@" in source
          assert 'id="installTitle"' in source
          assert 'id="connectTitle"' in source
          assert "cdn.jsdelivr.net" not in source
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          assert len(scripts) == 2
          Path("/tmp/mita-subscription.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/mita-subscription.js
          node --test tests/test_subscription.mjs

      - name: Build the image and verify bundled awgm-box
        run: |
          docker build -t mita-ci mita
          docker run --rm --network none --entrypoint /usr/local/bin/awgm-box mita-ci version
          docker build --target mita-runtime -t mita-server-ci mita
          docker build --target awgm-box-runtime -t awgm-box-ci mita
          docker run --rm --network none awgm-box-ci version

      - name: awgm-box accepts the router config Mita generates
        run: |
          # Every outbound type the share-link parser produces, policies with a local
          # rule set, reject/direct, Everything else and the PostgreSQL forward.
          out="$PWD/ci-router"
          python3 tests/render_router_config.py "$out"
          docker run --rm --network none -v "$out:$out:ro" \
            --entrypoint /usr/local/bin/awgm-box mita-ci check -c "$out/config.json"

      - name: Validate Hysteria 2.14 ACL with its real parser
        run: |
          out="$PWD/ci-hysteria"
          python3 tests/render_hysteria_config.py "$out"
          hy2() {
            docker run --rm --network none -v "$out:/config:ro" \
              --entrypoint hysteria tobyxdd/hysteria:v2.14.0 \
              acl test -c /config/server.yaml "$@"
          }
          check_acl() {
            local expected="$1"
            shift
            local output
            if ! output=$(hy2 "$@" 2>&1); then
              printf 'Hysteria ACL command failed:\n%s\n' "$output" >&2
              return 1
            fi
            printf '%s\n' "$output"
            if ! grep -E "Outbound: +${expected}( |$)" <<< "$output"; then
              printf 'Expected outbound %s was not selected\n' "$expected" >&2
              return 1
            fi
          }
          check_acl reject --ipv4 10.0.0.1 --auth alice 10.0.0.1:80
          check_acl router --ipv4 10.0.0.1 --auth bob 10.0.0.1:80
          check_acl reject --ipv4 127.0.0.1 --auth bob 127.0.0.1:80

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: mita-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update Docker Compose on the server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mita-ha' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS secret}"
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ||
                ! "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ||
                ! "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( DEPLOY_PORT > 65535 )); then
            echo "::error::Set a valid DEPLOY_HOST, DEPLOY_USER and DEPLOY_PORT"
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ || ! "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid deployment path or commit"
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" -l "$DEPLOY_USER" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            -- "$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" < scripts/deploy-compose.sh
