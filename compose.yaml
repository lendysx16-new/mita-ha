services:
  mita:
    build:
      context: ./mita
      target: linux
      args:
        MITA_BASE_IMAGE: debian:bookworm-slim
    entrypoint: ["/bin/bash", "/run.sh"]
    command: []
    init: true
    network_mode: host
    restart: unless-stopped
    environment:
      MITA_STANDALONE: "1"
      MITA_ADMIN_PASSWORD: ${MITA_ADMIN_PASSWORD:-}
      MITA_PUBLIC_HOST: ${MITA_PUBLIC_HOST:-localhost}
      MITA_PUBLIC_PORT: ${MITA_PUBLIC_PORT:-2022}
      MITA_SUBSCRIPTION_BASE_URL: ${MITA_SUBSCRIPTION_BASE_URL:-http://localhost:8099}
      MITA_POSTGRES_DSN: ${MITA_POSTGRES_DSN:-}
    volumes:
      - mita-data:/data

  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.14.4
    profiles: ["sing-box"]
    network_mode: host
    restart: unless-stopped
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - type: bind
        source: ./sing-box/config.json
        target: /etc/sing-box/config.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  mita-data:
    name: ${MITA_DATA_VOLUME:-mita-linux-data}
