services:
  mita:
    build: ./mita
    init: true
    network_mode: host
    restart: unless-stopped
    environment:
      MITA_ADMIN_PASSWORD: ${MITA_ADMIN_PASSWORD:-}
      MITA_PUBLIC_HOST: ${MITA_PUBLIC_HOST:-localhost}
      MITA_PUBLIC_PORT: ${MITA_PUBLIC_PORT:-2022}
      MITA_SUBSCRIPTION_BASE_URL: ${MITA_SUBSCRIPTION_BASE_URL:-http://localhost:8099}
      MITA_POSTGRES_DSN: ${MITA_POSTGRES_DSN:-}
      MITA_OUTBOUND_PROBE_URL: ${MITA_OUTBOUND_PROBE_URL:-}
    volumes:
      - mita-data:/data

  awgm-box:
    build:
      context: ./mita
      target: awgm-box-runtime
    profiles: ["awgm-box"]
    network_mode: host
    restart: unless-stopped
    command: ["run", "-c", "/etc/awgm-box/config.json"]
    volumes:
      - type: bind
        source: ./awgm-box/config.json
        target: /etc/awgm-box/config.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  mita-data:
    name: ${MITA_DATA_VOLUME:-mita-linux-data}
