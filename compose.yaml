services:
  backend:
    build: ./mita
    init: true
    network_mode: host
    restart: unless-stopped
    command: ["/run-backend.sh"]
    environment:
      MITA_ADMIN_PASSWORD: ${MITA_ADMIN_PASSWORD:-}
      MITA_PUBLIC_HOST: ${MITA_PUBLIC_HOST:-localhost}
      MITA_PUBLIC_PORT: ${MITA_PUBLIC_PORT:-2022}
      MITA_MIERU_LISTEN_PORTS: ${MITA_MIERU_LISTEN_PORTS:-2022}
      MITA_SUBSCRIPTION_BASE_URL: ${MITA_SUBSCRIPTION_BASE_URL:-http://localhost:8099}
      MITA_POSTGRES_DSN: ${MITA_POSTGRES_DSN:-}
      MITA_OUTBOUND_PROBE_URL: ${MITA_OUTBOUND_PROBE_URL:-}
      MITA_TELEGRAM_ENABLED: ${MITA_TELEGRAM_ENABLED:-false}
      MITA_TELEGRAM_BOT_TOKEN: ${MITA_TELEGRAM_BOT_TOKEN:-}
      MITA_TELEGRAM_CHAT_ID: ${MITA_TELEGRAM_CHAT_ID:-}
      MITA_CONTROL_SOCKET: /data/mita-control.sock
      MITA_HY2_HOST: ${MITA_HY2_HOST:-}
      MITA_HY2_PORT: ${MITA_HY2_PORT:-443}
      MITA_HY2_TLS_CERT: ${MITA_HY2_TLS_CERT:-/certs/fullchain.pem}
      MITA_HY2_TLS_KEY: ${MITA_HY2_TLS_KEY:-/certs/privkey.pem}
    volumes:
      - mita-data:/data
      - hysteria-config:/hysteria-config
      - hysteria-status:/run/hysteria2:ro

  mita:
    build:
      context: ./mita
      target: mita-runtime
    init: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - mita-data:/data

  hysteria2:
    image: tobyxdd/hysteria:v2.14.0
    profiles: ["hysteria2"]
    init: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/watch.sh"]
    volumes:
      - hysteria-config:/hysteria-config:ro
      - hysteria-status:/run/hysteria2
      - ./hysteria/watch.sh:/watch.sh:ro
      - ${HYSTERIA_CERT_DIR:-./hysteria/certs}:/certs:ro

  awgm-box:
    build:
      context: ./mita
      target: awgm-box-runtime
    profiles: ["awgm-box"]
    network_mode: host
    restart: unless-stopped
    command: ["run", "-c", "/etc/awgm-box/config.json"]
    volumes:
      - type: bind
        source: ./awgm-box/config.json
        target: /etc/awgm-box/config.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  mita-data:
    name: ${MITA_DATA_VOLUME:-mita-linux-data}
  hysteria-config:
  hysteria-status:
